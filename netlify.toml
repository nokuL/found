[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  node_bundler = "esbuild"

# Client-side pages (/checkout, /order/success, /order/cancelled). Real files and /api/* functions take priority.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
