<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Found Again | Refurbished furniture, electronics & equipment</title>
    <meta name="description" content="Shop quality pre-owned furniture, electronics, commercial equipment and curated African art. Inspected, restored, and backed by a 30-day warranty. Based in Apex, NC." />
    <meta property="og:title" content="Found Again" />
    <meta property="og:description" content="Good things, found again. Refurbished goods at 40–70% off retail, with a 30-day warranty." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="theme-color" content="#007A3D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Hidden static forms so Netlify detects them at deploy time. Field names must match the React forms. -->
    <!-- Paid orders are posted here by the Clover webhook function, so they arrive as form notifications. -->
    <form name="order" data-netlify="true" hidden>
      <input name="ref" /><input name="total" /><input name="fulfillment" /><input name="name" />
      <input name="email" /><input name="phone" /><input name="address" /><textarea name="items"></textarea>
    </form>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="email" />
      <select name="topic"><option>x</option></select>
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
